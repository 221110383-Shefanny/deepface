name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "pwen" ]
  pull_request:
    branches: [ "master", "main", "pwen" ]
  workflow_dispatch:

jobs:

  # Backend Testing
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    - name: Run PyTest
      working-directory: ./backend
      run: python -m pytest tests/ -v --cov=. --cov-report=xml || echo "No tests found"
    - name: Lint with flake8
      working-directory: ./backend
      run: pip install flake8 && flake8 . || true

  # Frontend Testing
  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install dependencies
      working-directory: ./frontend
      run: npm install
    - name: Run ESLint
      working-directory: ./frontend
      run: npx eslint src --ext .js,.jsx --max-warnings 5 || true
    - name: Run tests
      working-directory: ./frontend
      run: npm test || echo "No tests"
    - name: Build React App
      working-directory: ./frontend
      run: npm run build

  # Build & Push Docker Images
  build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v2
    - uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build & Push Backend Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.DOCKER_USERNAME }}/deepface-backend:latest
    - name: Build & Push Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.DOCKER_USERNAME }}/deepface-frontend:latest

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Trivy Scan Backend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/deepface-backend:latest
        format: 'sarif'
        output: 'trivy-backend.sarif'
    - name: Trivy Scan Frontend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/deepface-frontend:latest
        format: 'sarif'
        output: 'trivy-frontend.sarif'

  # Deploy (skip gracefully if secret missing)
  deploy:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v4

    - name: Setup kubeconfig
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      if: env.KUBE_CONFIG != ''
      run: |
        mkdir -p $HOME/.kube
        echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        echo "✅ Kubeconfig configured"

    - name: Deploy to Kubernetes
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      if: env.KUBE_CONFIG != ''
      run: |
        kubectl set image deployment/deepface-backend deepface-backend=$DOCKER_USERNAME/deepface-backend:latest --record || echo "Deployment not found"
        kubectl set image deployment/deepface-frontend deepface-frontend=$DOCKER_USERNAME/deepface-frontend:latest --record || echo "Deployment not found"
        kubectl rollout status deployment/deepface-backend --timeout=5m || true
        kubectl rollout status deployment/deepface-frontend --timeout=5m || true
        echo "✅ Kubernetes deployment completed"

    - name: Skip K8s Deployment
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      if: env.KUBE_CONFIG == ''
      run: echo "⚠️ KUBE_CONFIG secret not configured. Skipping Kubernetes deployment."

  # Notify
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
    - name: Success Notification
      run: |
        echo "🎉 Pipeline completed successfully!"
        echo "✅ Tests passed"
        echo "✅ Docker images built & pushed"
        echo "✅ Security scan completed"
        echo "✅ Kubernetes deployment handled gracefully"
