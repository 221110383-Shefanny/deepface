#         averageValue: "1000"

---
# PodDisruptionBudget untuk Backend - mencegah terlalu banyak pod yang di-terminate sekaligus
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: deepface-backend-pdb
  namespace: default
  labels:
    app: deepface-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: deepface-backend

---
# PodDisruptionBudget untuk Frontend
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: deepface-frontend-pdb
  namespace: default
  labels:
    app: deepface-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: deepface-frontend

