version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cpu
    ports:
      - "5000:5000"  # FastAPI default port
    volumes:
      - ./backend:/app
    command: uvicorn app:app --host 0.0.0.0 --port 5000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm start
    stdin_open: true
    tty: true
