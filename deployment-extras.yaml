apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deepface-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - deepface.example.com
    secretName: deepface-tls
  rules:
  - host: deepface.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: deepface-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: deepface-backend-service
            port:
              number: 5000

---
apiVersion: v1
kind: Namespace
metadata:
  name: deepface
  labels:
    name: deepface

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: deepface-quota
  namespace: deepface
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "20"

---
apiVersion: v1
kind: NetworkPolicy
metadata:
  name: deepface-network-policy
  namespace: deepface
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: deepface
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: deepface
  - to:
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: deepface-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: deepface-model-pv
  labels:
    type: local
spec:
  storageClassName: deepface-storage
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/deepface/models"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deepface-model-pvc
  namespace: deepface
  labels:
    app: deepface-backend
spec:
  storageClassName: deepface-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
